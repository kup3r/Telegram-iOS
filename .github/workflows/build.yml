name: CI

on:
  push:
    branches:
      - feature/ayu-tweaks-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Xcode 27 image provides the pinned Xcode 27 toolchain on macOS 27 (Apple Silicon).
    runs-on: xcode-27
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select project Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          echo "Runner operating system:"
          sw_vers
          VERSION_FILE="$RUNNER_TEMP/xcode-version.txt"
          xcodebuild -version | tee "$VERSION_FILE"
          ACTUAL_XCODE="$(awk '/^Xcode / { print $2; exit }' "$VERSION_FILE")"
          echo "Required Xcode: $XCODE_VERSION; selected Xcode: $ACTUAL_XCODE"
          [[ "$ACTUAL_XCODE" == "$XCODE_VERSION" ]] || { echo "Xcode version mismatch"; exit 1; }
          xcrun --sdk iphoneos --show-sdk-version

      - name: Create canonical source directory
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Build unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py generate-verification-profiles \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --destination=build-system/fake-codesigning/profiles
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          IPA_FOUND=0
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            if [[ -f "$f" ]]; then
              cp "$f" "$OUTPUT_PATH/"
              IPA_FOUND=1
            fi
          done
          [[ "$IPA_FOUND" -eq 1 ]] || { echo "Telegram.ipa was not produced"; exit 1; }

          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            if [[ -d "$f" ]]; then
              cp -R "$f" build/DSYMs/
            fi
          done
          if [[ -d build/DSYMs ]] && find build/DSYMs -mindepth 1 -maxdepth 1 | grep -q .; then
            ditto -c -k --sequesterRsrc --keepParent build/DSYMs "$OUTPUT_PATH/Telegram.DSYMs.zip"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AyuTweaks-iOS-${{ github.sha }}
          path: /Users/Shared/telegram-ios/build/artifacts/*
          if-no-files-found: error
          retention-days: 14
